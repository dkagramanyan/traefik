{{- if not (env "BACKEND_OPENVPN") -}}
{{- fail "Run setup and recreate Traefik so it receives its private network settings" -}}
{{- end }}
# No deployment inventory is shipped. Additional routes come from the admin UI.
http:
  routers:
    openvpn:
      rule: {{ printf "Host(`%s`)" (env "OPENVPN_HOST") | toJson }}
      entryPoints: [websecure]
      service: openvpn
      middlewares: [trusted-only]
      tls: {}
    https-redirect:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      service: noop@internal
      middlewares: [https-redirect]
    {{- range (env "SERVICE_ROUTES_JSON" | default "[]" | fromJson) }}
    {{ printf "custom-%s" .name | toJson }}:
      {{- $rule := printf "Host(`%s`)" .host }}
      {{- if .paths }}
      {{- $matches := list }}
      {{- range .paths }}
      {{- if hasSuffix "/" . }}
      {{- $matches = append $matches (printf "PathPrefix(`%s`)" .) }}
      {{- else }}
      {{- $matches = append $matches (printf "Path(`%s`)" .) }}
      {{- end }}
      {{- end }}
      {{- $rule = printf "%s && (%s)" $rule (join " || " $matches) }}
      {{- end }}
      rule: {{ $rule | toJson }}
      entryPoints: [websecure]
      service: {{ printf "custom-%s" .name | toJson }}
      {{- if not .public }}
      middlewares: [trusted-only]
      {{- end }}
      tls: {}
    {{- end }}
  services:
    openvpn:
      loadBalancer:
        servers:
        - url: {{ env "BACKEND_OPENVPN" | toJson }}
    {{- range (env "SERVICE_ROUTES_JSON" | default "[]" | fromJson) }}
    {{ printf "custom-%s" .name | toJson }}:
      loadBalancer:
        {{- if .insecure_tls }}
        serversTransport: insecure-backend
        {{- end }}
        servers:
        - url: {{ .url | toJson }}
    {{- end }}
  serversTransports:
    insecure-backend:
      insecureSkipVerify: true
  middlewares:
    trusted-only:
      ipAllowList:
        sourceRange: {{ env "TRUSTED_CIDRS" | splitList "," | toJson }}
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
tcp:
  routers:
    apple-relay:
      entryPoints: [apple-relay]
      rule: {{ printf "HostSNI(`%s`)" (env "APPLE_RELAY_HOST") | toJson }}
      service: apple-relay
      tls:
        options: apple-relay-http2
  services:
    apple-relay:
      loadBalancer:
        servers:
        - address: {{ env "APPLE_RELAY_BACKEND" | toJson }}
tls:
  options:
    apple-relay-http2:
      minVersion: VersionTLS12
      alpnProtocols: [h2]
