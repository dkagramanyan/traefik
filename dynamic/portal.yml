# Public client-only downloads; administrative APIs retain trusted-only.
http:
  routers:
    user-portal:
      rule: {{ printf "Host(`%s`) && (Path(`/portal`) || Path(`/api/portal`) || PathPrefix(`/api/portal/`) || PathPrefix(`/static/`))" (env "OPENVPN_HOST") | toJson }}
      priority: 200
      entryPoints: [websecure]
      service: openvpn
      tls: {}
