name: Validate deployment
on:
  push:
  pull_request:
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - name: Install Traefik for private portal routing tests
        run: |
          mkdir -p "$RUNNER_TEMP/portal-traefik"
          curl -fsSL --retry 3 https://github.com/traefik/traefik/releases/download/v3.7.15/traefik_v3.7.15_linux_amd64.tar.gz -o "$RUNNER_TEMP/portal-traefik/traefik.tar.gz"
          printf '%s  %s\n' 5b9f51199fcb7a3b5f7ae0f9dae8dcf01efadafd92c5fca96ea2822eca81f8e6 "$RUNNER_TEMP/portal-traefik/traefik.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/portal-traefik/traefik.tar.gz" -C "$RUNNER_TEMP/portal-traefik" traefik
          echo "TRAEFIK_BINARY=$RUNNER_TEMP/portal-traefik/traefik" >> "$GITHUB_ENV"
      - run: python scripts/validate.py
      - run: python -m pytest tests -q
      - run: python scripts/test_traefik.py
      - name: Build the pinned profile signer
        run: |
          docker build -t profile-signer:ci -f signer/Dockerfile https://github.com/dkagramanyan/openvpn-server.git#ffd1ef79c1a29294607ca52424d4216744db92b1
