api:
  dashboard: true

entryPoints:
  web:
    address: ":80"
    asDefault: true
    # Domain redirects and Zoraxy forwarding are in native-services.yml.
  websecure:
    address: ":443"
    asDefault: true
  apple-relay:
    address: ":8443"
  metrics:
    address: ":8082"

providers:
  docker:
    exposedByDefault: false
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@dgkagramanyan.ru
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: selectelv2
        propagation:
          delayBeforeChecks: 20s
        resolvers:
          - "a.ns.selectel.ru:53"
          - "b.ns.selectel.ru:53"

metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    addServicesLabels: true

log:
  level: INFO

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
